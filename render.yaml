# Render Blueprint — FastAPI AI service (COMS matching + chatbot).
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: unify-ai
    runtime: python
    rootDir: backend
    # Matching loads torch + all-mpnet-base-v2 (~1–1.5 GB RAM). The 512 MB
    # plans (free/starter) will run out of memory; standard has 2 GB.
    plan: standard
    buildCommand: >-
      pip install --upgrade pip &&
      pip install torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt &&
      python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-mpnet-base-v2')"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # Model is downloaded at build time into the project dir, which (unlike
      # ~/.cache) is kept for runtime — so the first request isn't a 400 MB download.
      - key: HF_HOME
        value: /opt/render/project/src/backend/.hf_cache
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Deployed frontend origin(s), comma-separated, e.g. https://unify.vercel.app
      - key: CORS_ORIGINS
        sync: false
